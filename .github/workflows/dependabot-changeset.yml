name: Dependabot Changeset

# Dependabot PRs don't carry a changeset, so dependency bumps never reach the
# changelog or trigger a release. This workflow writes one into the PR branch,
# then approves the PR and enables auto-merge for patch and minor updates
# (major updates are left for a human). Auto-merge waits for the checks that
# the `main` ruleset requires.
#
# The changeset commit becomes the PR's head, so the required checks must run
# on it. GitHub either holds the runs that push triggers for approval
# (github-actions[bot] counts as a first-time contributor) or triggers none;
# this workflow approves held runs, or starts CI itself.
#
# `pull_request_target` is required because the default `pull_request` token for
# Dependabot is read-only and cannot push. No code from the PR is executed here:
# the branch is checked out only so a file can be written and committed (no
# install, no build, no scripts).
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write # to approve or start CI runs on the changeset commit

jobs:
  add-changeset:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write changeset
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          SUMMARY=$(node --input-type=module -e '
            const deps = JSON.parse(process.env.UPDATED_DEPENDENCIES || "[]");
            const describe = (d) =>
              d.prevVersion && d.newVersion
                ? `${d.dependencyName} ${d.prevVersion} → ${d.newVersion}`
                : d.dependencyName;
            if (deps.length === 0) {
              // Fall back to the PR title (e.g. grouped updates with no metadata)
              const title = process.env.PR_TITLE.replace(/^chore:\s*/, "");
              process.stdout.write(title.charAt(0).toUpperCase() + title.slice(1));
            } else if (deps.length === 1) {
              const d = deps[0];
              process.stdout.write(
                d.prevVersion && d.newVersion
                  ? `Bump ${d.dependencyName} from ${d.prevVersion} to ${d.newVersion}`
                  : `Bump ${d.dependencyName}`
              );
            } else {
              process.stdout.write(`Bump dependencies: ${deps.map(describe).join(", ")}`);
            }
          ')

          CHANGESET=".changeset/dependabot-pr-${PR_NUMBER}.md"
          PACKAGE=$(jq -r .name package.json)

          cat > "$CHANGESET" <<EOF
          ---
          "$PACKAGE": patch
          ---

          $SUMMARY
          EOF

          echo "Wrote $CHANGESET:"
          cat "$CHANGESET"

      - name: Commit changeset
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".changeset/dependabot-pr-${PR_NUMBER}.md"

          if git diff --quiet --cached; then
            echo "Changeset already up to date — nothing to commit."
            exit 0
          fi

          git commit -m "chore: add changeset for dependency update"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

          # GitHub may hold the pull_request runs this push triggers for approval
          # (github-actions[bot] counts as a first-time contributor), and held
          # runs block merging. Approve them; if GitHub triggered nothing,
          # start CI directly.
          SHA=$(git rev-parse HEAD)
          SEEN=""
          # Runs appear a few seconds after the push, one per workflow; keep
          # looking for a minute and approve each held one.
          for attempt in $(seq 1 12); do
            sleep 5
            RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA" -q '.workflow_runs[] | select(.event == "pull_request") | "\(.id) \(.conclusion)"')
            [ -n "$RUNS" ] && SEEN=1
            for id in $(echo "$RUNS" | awk '$2 == "action_required" {print $1}'); do
              echo "Approving held run $id"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
            done
          done
          if [ -z "$SEEN" ]; then
            echo "No pull_request runs on $SHA; starting CI."
            gh workflow run ci.yml --ref "$BRANCH"
          fi

  auto-merge:
    needs: add-changeset
    # Patch and minor updates only; major updates may need code changes.
    if: needs.add-changeset.outputs.update-type != 'version-update:semver-major'
    runs-on: ubuntu-latest
    steps:
      - name: Approve and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
