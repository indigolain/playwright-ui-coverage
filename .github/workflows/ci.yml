name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  demo:
    # Each job runs the demo in both recording modes (fixture and register)
    # and checks that they produce the same coverage.json, so a broken
    # register hook fails CI. See scripts/demo-both-modes.sh. Chromium jobs
    # also run the in-browser checks and the sharding / merge-reports check.
    name: demo (${{ matrix.browser }}, @playwright/test ${{ matrix.playwright }})
    # Older Playwright releases don't know the newest Ubuntu image.
    runs-on: ${{ matrix.playwright == 'latest' && 'ubuntu-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # Oldest supported version (keep in sync with peerDependencies and README) and latest.
        playwright: ['1.50.0', latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install @playwright/test@${{ matrix.playwright }}
        run: npm install --no-save @playwright/test@${{ matrix.playwright }} && npx playwright --version
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: scripts/demo-both-modes.sh
        env:
          BROWSER: ${{ matrix.browser }}
      - name: check:interactivity
        if: matrix.browser == 'chromium'
        run: npm run check:interactivity
      - name: check:locators (against the demo report)
        if: matrix.browser == 'chromium'
        run: npm run check:locators
      - name: demo:sharded (fixture mode)
        if: matrix.browser == 'chromium'
        run: npm run demo:sharded
        env:
          CI: true
      # Rebuilding the report from ui-coverage-report/data/ with the CLI gives the same result.
      - name: check:rebuild (fixture mode)
        if: matrix.browser == 'chromium'
        run: npm run check:rebuild
        env:
          CI: true
      - name: demo:sharded (register mode)
        if: matrix.browser == 'chromium'
        run: npm run demo:sharded
        env:
          CI: true
          UICOV_MODE: register
      - name: check:rebuild (register mode)
        if: matrix.browser == 'chromium'
        run: npm run check:rebuild
        env:
          CI: true
          UICOV_MODE: register
      # Baseline mode, compare and the step summary, end to end (scripts/check-baseline.mjs).
      - name: check:baseline
        if: matrix.browser == 'chromium'
        run: npm run check:baseline
        env:
          CI: true
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: demo-${{ matrix.browser }}-${{ matrix.playwright }}
          path: |
            .ui-coverage-ci/
            ui-coverage-report/
            test-results/
          include-hidden-files: true
          retention-days: 7
