name: Publish

# Release flow (Changesets):
#  1. Every PR that changes the package adds a changeset (`npx changeset`).
#  2. On push to main, this workflow opens or updates a "chore: version packages"
#     PR that bumps the version and writes CHANGELOG.md from the changesets.
#  3. Merging that PR runs this workflow again, which publishes the new version
#     to npm and creates the matching git tag and GitHub release.
#
# Publishing uses npm trusted publishing (OIDC): there is no npm token in the
# repository secrets. The package's trusted publisher on npmjs.com must name
# this repository, this workflow file (publish.yml) and the `npm` environment.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write # to approve or start CI runs on the version PR

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11, which trusted publishing requires.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Set npm provenance
        run: npm config set provenance true

      - name: Create release PR or publish
        id: changesets
        # v2 is the release line for Changesets v3 (v1 doesn't recognise v3's
        # publish output, so it never pushed tags or created GitHub releases).
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: npm run release
          version-script: npm run version-packages
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"

      # `main` requires CI to pass on the version PR, which is pushed with
      # GITHUB_TOKEN. Make sure its runs aren't left waiting for approval.
      - name: Run CI on the version PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: changeset-release/main
        run: |
          git fetch -q origin "$BRANCH"
          git checkout -q FETCH_HEAD
          # GitHub may hold the pull_request runs that pushes to the version PR
          # trigger for approval (github-actions[bot] counts as a first-time contributor), and held
          # runs block merging. Approve them; if GitHub triggered nothing,
          # start CI directly.
          SHA=$(git rev-parse HEAD)
          SEEN=""
          # Runs appear a few seconds after the push, one per workflow; keep
          # looking for a minute and approve each held one.
          for attempt in $(seq 1 12); do
            sleep 5
            RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA" -q '.workflow_runs[] | select(.event == "pull_request") | "\(.id) \(.conclusion)"')
            [ -n "$RUNS" ] && SEEN=1
            for id in $(echo "$RUNS" | awk '$2 == "action_required" {print $1}'); do
              echo "Approving held run $id"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
            done
          done
          if [ -z "$SEEN" ]; then
            echo "No pull_request runs on $SHA; starting CI."
            gh workflow run ci.yml --ref "$BRANCH"
          fi
