name: Sharding

# Runs the demo unsharded and as 2 blob-reporter shards, merges the shards with
# `merge-reports` after deleting test-results/, and checks that the UI coverage
# report (numbers and screenshots) matches. See scripts/check-sharding.mjs.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  merge-reports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [fixture, register]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run demo:sharded
        env:
          CI: true
          UICOV_MODE: ${{ matrix.mode }}
      # Rebuilding the report from ui-coverage-report/data/ with the CLI gives the same result.
      - run: npm run check:rebuild
        env:
          CI: true
          UICOV_MODE: ${{ matrix.mode }}
      - run: node --test test/model.test.mjs
